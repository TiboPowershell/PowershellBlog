# ---------------------------------------------------------------------------
# Site settings
# ---------------------------------------------------------------------------
locale                   : "en-US"
title                    : "PowerShell Blog"
title_separator          : "|"
subtitle                 : "PowerShell for Microsoft 365 & Entra ID"
name                     : "Tibo Hulens"
description              : >-
  PowerShell scripts and guides for Microsoft 365 and Entra ID admins:
  Access Packages, Entitlement Management, PIM and Microsoft Graph reporting.
url                      : "https://tibopowershell.github.io"
baseurl                  : "/PowershellBlog"
repository               : "TiboPowershell/PowershellBlog"
masthead_title           : "PowerShell Blog"

# Default share/preview image used by Google, LinkedIn, Teams, Slack, X
og_image                 : "/assets/images/og-default.png"
og_image_alt             : "PowerShell Blog - PowerShell for Microsoft 365 and Entra ID"
# Default teaser thumbnail for posts that don't set their own
teaser                   : "/assets/images/og-default.png"

# Drives the schema.org Person block + sameAs links (Google entity graph)
social:
  type                   : Person
  name                   : "Tibo Hulens"
  links:
    - "https://www.linkedin.com/in/tibo-hulens-2a907659/"
    - "https://github.com/TiboPowershell"

# Site verification (the googlee8b78a8fcf949ad3.html file also works; this is a
# second, more robust method that survives file moves)
# google_site_verification : "PASTE_META_TAG_CONTENT_HERE"
# bing_site_verification   :

# Analytics - fill in to see which posts actually get traffic
# analytics:
#   provider               : "google-gtag"
#   google:
#     tracking_id          : "G-XXXXXXXXXX"
#     anonymize_ip         : true

# ---------------------------------------------------------------------------
# Theme
# ---------------------------------------------------------------------------
remote_theme             : mmistakes/minimal-mistakes
minimal_mistakes_skin    : default   # palette lives in assets/css/main.scss
search                   : true
search_full_content      : true
enable_copy_code_button  : true
breadcrumbs              : true
words_per_minute         : 200

author:
  name                   : "Tibo Hulens"
  avatar                 : "/assets/images/1741171555873.jpg"
  bio                    : "M365 / Security Engineer. I write PowerShell so I don't have to click through the Entra portal 300 times."
  location               : "Belgium"
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/tibo-hulens-2a907659/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/TiboPowershell"

footer:
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/tibo-hulens-2a907659/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/TiboPowershell"
    - label: "RSS"
      icon: "fas fa-fw fa-rss-square"
      url: "/PowershellBlog/feed.xml"

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
markdown                 : kramdown
kramdown:
  input                  : GFM
  auto_ids               : true
  syntax_highlighter     : rouge

# Clean, short post URLs. Old /:categories/:title/ URLs are kept alive with
# redirect_from entries in each post's front matter.
permalink                : /:title/
paginate                 : 10
paginate_path            : /page:num/
timezone                 : Europe/Brussels

include:
  - _pages

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from
  - jemoji
  - jekyll-include-cache

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      show_date: true
      comments: true
      share: true
      related: true
      toc: true
      toc_label: "On this page"
      toc_sticky: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
